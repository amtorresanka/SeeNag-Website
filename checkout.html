<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Out</title>
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body>
    <header>
        <a href="index.html" id="BackBtn" class="back-btn">← Back</a>
        <h1>Check Out</h1>
			<div id="cart-icon">
			<span class="material-symbols-outlined" aria-label="Shopping cart" style="font-size:36px;">shopping_cart</span>
			</div>
    </header>
<!-- Green box section-->
    <section id="cartSection" class="cart-section is-empty">
    
    <div id="emptyState" class="empty-message">
      Cart is empty.
    </div>

    <div id="filledState" class="filled-container hidden">
        <div id="cartItemsContainer"></div>

        <div class="totals-wrapper">
            <div class="totals-box">
                <div class="total-row total-final">
                    <span>Total</span>
                    <span id="totalText">₱ 0.00</span>
                </div>
            </div>
        </div>
    </div>

</section>

<section id="orderFormSection" class="order-form-section hidden">
    <h2>Fill in the required fields and submit this form to complete your order</h2>

        <form id="checkoutForm">
            <div class="form-grid">
                <!-- Left Column -->
                <div>
                    <div class="form-group">
                        <label for ="firstName">Customer name</label>
                        <div class="two-col">
                            <input type="text" id="firstName" placeholder="First name" aria-label="First name" required>
                            <input type="text" id="lastName" placeholder="Last name" aria-label="Last name" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="user@gmail.com" required>
                    </div>
                
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" class="numeric-only" inputmode="numeric" pattern="[0-9]*" maxlength="13" placeholder="0961 000 0000" aria-label="phone" required>
                    </div>

                    <div class="form-group">
                        <label for="streetAddress">Shipping Address</label>
                        <input type="text" id="streetAddress" required>
                        <span class="sub-label">Street Address</span>
                    </div>

                    <div class="form-group">
                        <input type="text" id="addedAddress" aria-label="Apartment, unit, building, floor, etc.">
                        <span class="sub-label">Apartment, unit, building, floor, etc.</span>
                    </div>

                    <div class="form-group two-col">
                        <div>
                            <input type="text" id="country" aria-label="Country" required>
                            <span class="sub-label">Country</span>
                        </div>
                        <div>
                            <input type="text" id="city" aria-label="City" required>
                            <span class="sub-label">City</span>
                        </div>
                    </div>

                    <div class="form-group two-col">
                        <div>
                            <input type="text" id="postalCode" class="numeric-only" inputmode="numeric" pattern="[0-9]*" maxlength="4" aria-label="Postal or Zip Code" required>
                            <span class="sub-label">Postal / Zip Code</span>
                        </div>
                        <div>
                            <input type="text" id="stateProvince" aria-label="State or Province" required>
                            <span class="sub-label">State / Province</span>
                        </div>
                    </div>
                </div>
                <!-- Right Column -->
                <div>
                    <div class="form-group">
                        <span><strong>Payment Method</strong></span>
                        <div class="payment-header">
                        <label for="cardNumber">Credit / Debit Card</label>
                        <div class="card-logos">
                            <img src="images/mastercard logo.png" alt="mastercard">
                            <img src="images/visa logo.png" alt="visa">
                        </div>
                    </div>
                        <input type="text" id="cardNumber" class="numeric-only" inputmode="numeric" pattern="[0-9]*" maxlength="19" placeholder="0000 0000 0000 0000">
                    </div>
                

                    <div class="form-group">
                        <label for="cardName">Name on card</label>
                        <input type="text" id="cardName">
                    </div>

                    <div class="form-group two-col">
                        <div>
                            <label for="expiryDate">Expiry date</label>
                            <input type="text" id="expiryDate" class="expiry-input" inputmode="numeric" maxlength="7" placeholder="MM / YY">
                        </div>
                        <div>
                            <label for="cvc">CVC</label>
                            <input type="text" id="cvc" class="numeric-only" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="CVC" aria-label="cvc">
                        </div>
                    </div>

                    <div class="payment-option">
                        <label for="paypalRadio" class="payment-label">
                            <img src="images/paypal logo.png" alt="paypal" class="payment-logo">
                        	<span>Paypal</span>
						</label>
                        <input type="radio" id="paypalRadio" name="payment" value="paypal">
                    <div class="payment-option">
                        <label for="gcashRadio" class="payment-label">
                            <img src="images/gcash logo.png" alt="gcash" class="payment-logo">
                        	<span>Gcash</span>
						</label>
                        <input type="radio" id="gcashRadio" name="payment" value="gcash">
                    </div>
                    
                   <div class="form-group instructions-group">
                <label for="specialInstructions">Special Instructions</label>
                <textarea id="specialInstructions" rows="5"></textarea>
            </div>
        </div>
	</div>
            <div class="submit-container">
                <button type="submit" class="submit-btn">Submit</button>
            </div>
        </form>
</section>

<script src="js/checkout.js"></script>

</body>
</html>
