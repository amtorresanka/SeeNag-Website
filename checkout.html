<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Out</title>
    <link rel="stylesheet" href="checkout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="index.html" id="BackBtn" class="back-btn">← Back</a>
        <h1>Check Out</h1>
        <div id="cart-icon">
            <img src="Images/Shopping Cart.svg" alt="Shopping Cart" class="cart-icon">
        </div>
    </header>
<!-- Green box section-->
    <section id="cartSection" class="cart-section is-empty">
    
    <div id="emptyState" class="empty-message">
      Cart is empty.
    </div>

    <div id="filledState" class="filled-container hidden">
        <div id="cartItemsContainer"></div>

        <div class="totals-wrapper">
            <div class="totals-box">
                <div class="total-row total-final">
                    <span>Total</span>
                    <span id="totalText">₱ 0.00</span>
                </div>
            </div>
        </div>
    </div>

</section>

<section id="orderFormSection" class="order-form-section">
    <h2>Fill in the required fields and submit this form to complete your order</h2>

        <form id="checkoutForm">
            <div class="form-grid">
                <!-- Left Column -->
                <div>
                    <div class="form-group">
                        <label>Customer name</label>
                        <div class="two-col">
                            <input type="text" placeholder="First name" required>
                            <input type="text" placeholder="Last name" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" placeholder="user@gmail.com" required>
                    </div>
                
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" class="numeric-only" inputmode="numeric" pattern="[0-9]*" maxlength="13" placeholder="0961 000 0000" required>
                    </div>

                    <div class="form-group">
                        <label>Shipping Address</label>
                        <input type="text" required>
                        <span class="sub-label">Street Address</span>
                    </div>

                    <div class="form-group">
                        <input type="text">
                        <span class="sub-label">Apartment, unit, building, floor, etc.</span>
                    </div>

                    <div class="form-group two-col">
                        <div>
                            <input type="text" required>
                            <span class="sub-label">Country</span>
                        </div>
                        <div>
                            <input type="text" required>
                            <span class="sub-label">City</span>
                        </div>
                    </div>

                    <div class="form-group two-col">
                        <div>
                            <input type="text" class="numeric-only" inputmode="numeric" pattern="[0-9]*" maxlength="4" required>
                            <span class="sub-label">Postal / Zip Code</span>
                        </div>
                        <div>
                            <input type="text" required>
                            <span class="sub-label">State / Province</span>
                        </div>
                    </div>
                </div>
                <!-- Right Column -->
                <div>
                    <div class="form-group">
                        <label><strong>Payment Method</strong></label>
                        <div class="payment-header">
                        <label>Credit / Debit Card</label>
                        <div class="card-logos">
                            <img src="Images/mastercard logo.png" alt="mastercard">
                            <img src="Images/visa logo.png" alt="visa">
                        </div>
                    </div>
                        <input type="text" class="numeric-only" inputmode="numeric" pattern="[0-9]*" maxlength="19" placeholder="0000 0000 0000 0000">
                    </div>
                

                    <div class="form-group">
                        <label>Name on card</label>
                        <input type="text">
                    </div>

                    <div class="form-group two-col">
                        <div>
                            <label>Expiry date</label>
                            <input type="text" class="expiry-input" inputmode="numeric" maxlength="7" placeholder="MM / YY">
                        </div>
                        <div>
                            <label>CVC</label>
                            <input type="text" class="numeric-only" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="CVC">
                        </div>
                    </div>

                    <div class="payment-option">
                        <div class="payment-label">
                            <img src="Images/paypal logo.png" alt="paypal" class="payment-logo">
                        <span>Paypal</span>
                        </div>
                        <input type="radio" name="payment" value="paypal">
                    </div>
                    <div class="payment-option">
                        <div class="payment-label">
                            <img src="Images/gcash logo.png" alt="gcash" class="payment-logo">
                        <span>Gcash</span>
                        </div>
                        <input type="radio" name="payment" value="gcash">
                    </div>
                    
                    <div class="form-group instructions-group">
                        <label>Special Instructions</label>
                        <textarea rows="8"></textarea>
                    </div>
                </div>

            </div>
            <div class="submit-container">
                <button type="submit" class="submit-btn">Submit</button>
            </div>
        </form>
</section>

<script src="checkout.js"></script>

</body>
</html>
