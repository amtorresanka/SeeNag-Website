<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Everyday Comfort Tee — Seenag</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:ital,wght@0,400;0,500&family=Lora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <link rel="stylesheet" href="css/productpages.css">
</head>
<body>
  <header>
<nav class="navbar border-bottom px-4 py-3" aria-label="Main navigation">
  <div class="container-fluid">
    <span class="navbar-brand brand fs-4">
      <img src="images/seenag-logo.png" alt="Seenag logo" style="height:42px; vertical-align:-13px; margin-right:6px;">
        Seenag
    </span>

    <div class="nav-links d-flex gap-3 align-items-center">
      <a href="index.html" class="nav-link-custom">Home</a>
      <a href="shop.html" class="nav-link-custom nav-pill">Shop</a>
      <a href="about.html" class="nav-link-custom">About</a>
      <a href="contact.html" class="nav-link-custom">Contact</a>
    </div>

    <a href="checkout.html" class="text-dark text-decoration-none" aria-label="View cart">
  <span class="material-symbols-outlined">shopping_cart</span>
  </a>
  </div>
</nav>
  </header>
  <main id="main">
    <section class="container py-5">
      <div class="row g-4 align-items-start">

        <div class="col-lg-3" style="margin-top:80px;">
          <span class="badge bg-white text-dark mb-3" style="border:2px solid #000; border-radius:0;">Seenag Collection</span>
          <h1 class="display-title display-5 fw-semibold">Everyday<br>Comfort<br>Tee</h1>
          <p class="mt-3 product-desc">A plain, comfortable tee designed for everyday wear.</p>
          <div class="d-flex gap-2" style="margin-top:30px;">
           <img src="images/everydaycomfort-front.png" alt="front view" class="thumb active-thumb" onclick="swapImage(this)">
           <img src="images/everydaycomfort-back.png" alt="back view" class="thumb" onclick="swapImage(this)">
           <img src="images/everydaycomfort-detail.png" alt="Close-up" class="thumb" onclick="swapImage(this)">
          </div>
        </div>

        <div class="col-lg-6">
        <img id="mainImage" src="images/everydaycomfort-front.png" alt="Everyday Comfort Tee shown on a model" class="border" style="width:600px;height:600px;object-fit:cover;display:block;margin:0 auto;">
        </div>

        <div class="col-lg-3" style="margin-top:80px; padding-left:40px;">
          <p class="price fw-semibold mb-3">&#8369;499</p>
          <hr>

          <p class="mb-2 fs-5">Size <span class="text-secondary">|</span> <span id="selectedSize">—</span></p>
          <div class="btn-group mb-3 flex-wrap" role="group" aria-label="Choose your size">
            <input type="radio" class="btn-check" name="size" id="sizeXS" value="XS">
            <label class="btn btn-outline-dark" for="sizeXS">XS</label>

            <input type="radio" class="btn-check" name="size" id="sizeS" value="S">
            <label class="btn btn-outline-dark" for="sizeS">S</label>

            <input type="radio" class="btn-check" name="size" id="sizeM" value="M">
            <label class="btn btn-outline-dark" for="sizeM">M</label>

            <input type="radio" class="btn-check" name="size" id="sizeL" value="L">
            <label class="btn btn-outline-dark" for="sizeL">L</label>

            <input type="radio" class="btn-check" name="size" id="sizeXL" value="XL">
            <label class="btn btn-outline-dark" for="sizeXL">XL</label>
          </div>
          <hr>

          <p class="mb-3 fs-5">Quantity <span class="text-secondary">|</span> <span id="selectedQty">—</span></p>
          <div class="input-group mb-3">
            <button class="btn btn-outline-dark" type="button" onclick="changeQty(-1)" aria-label="Decrease quantity">&#8722;</button>
            <input type="text" id="qty" class="form-control text-center" value="0" aria-label="Quantity">
            <button class="btn btn-outline-dark" type="button" onclick="changeQty(1)" aria-label="Increase quantity">+</button>
          </div>

          <button type="button" id="orderBtn"
            class="btn order-btn w-100 py-2"
            data-name="Everyday Comfort Tee"
            data-price="499"
            data-image="images/everydaycomfort-front.png"
            aria-label="Order the Everyday Comfort Tee">
              ORDER
          </button>
        </div>

      </div>
    </section>

    <section class="also-like">
      <div class="big-seenag" aria-hidden="true">SEENAG</div>

      <div class="container position-relative">
        <div class="row justify-content-between align-items-start g-4">

          <div class="col-md-4 col-lg-3">
            <a href="dogoodwork.html" class="like-card">
              <img src="images/dogoodwork-front.png" alt="Do Good Work Tee">
              <p class="like-name">Do Good Work Tee</p>
              <p class="like-price">&#8369;499</p>
            </a>
          </div>

          <div class="col-md-4 text-center order-first order-md-0">
            <h2 class="also-like-title">You May Also Like</h2>
          </div>

          <div class="col-md-4 col-lg-3">
            <a href="dontbelate.html" class="like-card">
              <img src="images/dontbelate-front.png" alt="Don't Be Late Tee">
              <p class="like-name">Don't Be Late Tee</p>
              <p class="like-price">&#8369;499</p>
            </a>
          </div>

        </div>
      </div>
    </section>
  </main>

  <footer class="py-4 border-top">
    <div class="container">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
        <span class="brand fs-5">
           <img src="images/seenag-logo.png" alt="" style="height:30px; vertical-align:-8px; margin-right:6px;">
           Seenag
        </span>
        <div class="d-flex gap-5">
          <a href="privacyterms.html" class="text-dark text-decoration-none">Privacy</a>
          <a href="privacyterms.html" class="text-dark text-decoration-none">Terms</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/productpages.js"></script>
</body>
</html>
